<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    header {
      background: #2c3e50;
      color: #fff;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.75;
    }

    .input-area {
      display: flex;
      padding: 20px;
      gap: 8px;
      border-bottom: 1px solid #eee;
    }

    #item-input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #item-input:focus {
      border-color: #667eea;
    }

    #add-btn {
      padding: 12px 20px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #add-btn:hover {
      background: #5568d3;
    }

    #add-btn:active {
      transform: scale(0.97);
    }

    .stats {
      padding: 12px 20px;
      background: #f8f9fb;
      font-size: 0.85rem;
      color: #666;
      display: flex;
      justify-content: space-between;
    }

    #list {
      list-style: none;
      max-height: 50vh;
      overflow-y: auto;
    }

    #list li {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
      transition: background 0.15s;
    }

    #list li:hover {
      background: #f8f9fb;
    }

    #list li:last-child {
      border-bottom: none;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #667eea;
      flex-shrink: 0;
    }

    .item-text {
      flex: 1;
      font-size: 1rem;
      color: #333;
      word-break: break-word;
    }

    li.checked .item-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #e74c3c;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #fee;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #aaa;
      font-style: italic;
    }

    .clear-area {
      padding: 12px 20px;
      border-top: 1px solid #eee;
      text-align: right;
    }

    #clear-btn {
      background: transparent;
      border: 1px solid #ddd;
      color: #666;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    #clear-btn:hover {
      background: #f5f5f5;
      border-color: #bbb;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛒 쇼핑 리스트</h1>
      <p>로컬 브라우저에 자동 저장됩니다</p>
    </header>

    <div class="input-area">
      <input
        type="text"
        id="item-input"
        placeholder="아이템을 입력하세요..."
        maxlength="80"
      />
      <button id="add-btn">추가</button>
    </div>

    <div class="stats">
      <span id="total-count">총 0개</span>
      <span id="checked-count">완료 0개</span>
    </div>

    <ul id="list"></ul>

    <div class="clear-area">
      <button id="clear-btn">완료 항목 모두 삭제</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "shopping-list-items";
    const input = document.getElementById("item-input");
    const addBtn = document.getElementById("add-btn");
    const list = document.getElementById("list");
    const totalCount = document.getElementById("total-count");
    const checkedCount = document.getElementById("checked-count");
    const clearBtn = document.getElementById("clear-btn");

    let items = loadItems();

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        if (e?.name === "QuotaExceededError") {
          alert("저장 공간이 가득 찼습니다. 완료된 항목을 삭제한 뒤 다시 시도해 주세요.");
        } else {
          alert("저장에 실패했습니다: " + (e?.message ?? e));
        }
      }
    }

    function render() {
      list.innerHTML = "";

      if (items.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "아직 아이템이 없습니다. 위에서 추가해 보세요!";
        list.appendChild(empty);
      } else {
        items.forEach((item) => {
          const li = document.createElement("li");
          if (item.checked) li.classList.add("checked");

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "checkbox";
          checkbox.checked = item.checked;
          checkbox.addEventListener("change", () => toggleItem(item.id));

          const text = document.createElement("span");
          text.className = "item-text";
          text.textContent = item.text;

          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.textContent = "✕";
          delBtn.title = "삭제";
          delBtn.addEventListener("click", () => deleteItem(item.id));

          li.appendChild(checkbox);
          li.appendChild(text);
          li.appendChild(delBtn);
          list.appendChild(li);
        });
      }

      const total = items.length;
      const done = items.filter((i) => i.checked).length;
      totalCount.textContent = `총 ${total}개`;
      checkedCount.textContent = `완료 ${done}개`;
    }

    function addItem() {
      const text = input.value.trim();
      if (!text) return;
      items.push({
        id: crypto.randomUUID(),
        text,
        checked: false,
      });
      input.value = "";
      saveItems();
      render();
      input.focus();
    }

    function toggleItem(id) {
      const item = items.find((i) => i.id === id);
      if (item) {
        item.checked = !item.checked;
        saveItems();
        render();
      }
    }

    function deleteItem(id) {
      items = items.filter((i) => i.id !== id);
      saveItems();
      render();
    }

    function clearChecked() {
      const hasChecked = items.some((i) => i.checked);
      if (!hasChecked) return;
      if (confirm("완료된 항목을 모두 삭제하시겠습니까?")) {
        items = items.filter((i) => !i.checked);
        saveItems();
        render();
      }
    }

    addBtn.addEventListener("click", addItem);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addItem();
    });
    clearBtn.addEventListener("click", clearChecked);

    render();
    input.focus();
  </script>
</body>
</html>
